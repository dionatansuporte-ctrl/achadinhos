<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OfertasDaHora · conectando Mercado Livre</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#e9ecf2;font-family:Inter,system-ui,Segoe UI,sans-serif}
  .card{max-width:520px;background:#171a21;border:1px solid #2a303c;border-radius:20px;padding:32px;text-align:center;box-shadow:0 10px 35px rgba(0,0,0,.35)}
  .logo{width:56px;height:56px;border-radius:16px;background:#ff6a1a;color:#fff;font-weight:900;font-size:28px;display:grid;place-items:center;margin:0 auto 14px}
  h1{font-size:22px;margin:0 0 8px}p{color:#98a2b6;line-height:1.5;margin:8px 0}
  a.btn{display:inline-block;margin-top:14px;background:#ff6a1a;color:#fff;text-decoration:none;font-weight:800;padding:12px 20px;border-radius:12px}
  code{background:#1e232d;border:1px solid #2a303c;border-radius:6px;padding:2px 6px;font-size:13px;word-break:break-all}
  .err{color:#ff5d5d;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="logo">O</div>
  <h1 id="t">Conectando ao OfertasDaHora…</h1>
  <p id="m">O Mercado Livre autorizou. Levando você de volta ao sistema no seu computador.</p>
  <div id="x"></div>
</div>
<script>
(function(){
  // O Mercado Livre exige uma URL de retorno pública em HTTPS e não aceita localhost.
  // Esta página pública recebe ?code=&state= e repassa para a API que roda no PC do usuário.
  // Para apontar para outra porta/host, abra esta página uma vez com #api=http://SEU-HOST:PORTA
  var DEFAULT_API = 'http://localhost:3333';
  var CALLBACK = '/api/integrations/mercadolivre/callback';
  try {
    var h = location.hash.match(/api=([^&]+)/);
    if (h) { localStorage.setItem('ofertasdahora_api', decodeURIComponent(h[1])); }
  } catch (e) {}
  var api = DEFAULT_API;
  try { api = localStorage.getItem('ofertasdahora_api') || DEFAULT_API; } catch (e) {}
  var q = new URLSearchParams(location.search);
  var t = document.getElementById('t'), m = document.getElementById('m'), x = document.getElementById('x');
  if (q.get('error')) {
    t.textContent = 'O Mercado Livre não autorizou';
    m.innerHTML = '<span class="err">' + (q.get('error_description') || q.get('error')) + '</span><br>Volte ao OfertasDaHora e tente conectar de novo.';
    return;
  }
  if (!q.get('code') || !q.get('state')) {
    t.textContent = 'Página de retorno do Mercado Livre';
    m.innerHTML = 'Esta página só serve para o Mercado Livre devolver a autorização ao OfertasDaHora. Não há nada para fazer aqui.<br><br>API de destino: <code>' + api + '</code>';
    return;
  }
  var target = api + CALLBACK + location.search;
  x.innerHTML = '<p>Se não abrir sozinho em alguns segundos, a API não está rodando no seu computador. Abra o OfertasDaHora e clique abaixo.</p><a class="btn" href="' + target.replace(/"/g, '&quot;') + '">Concluir conexão</a><p><code>' + target.replace(/</g, '&lt;') + '</code></p>';
  location.replace(target);
})();
</script>
</body>
</html>
